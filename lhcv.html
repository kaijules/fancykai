<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d26" />
    <meta name="description" content="Ewiges (@loveisubtw)" />
    <title>Ewiges · Liên Hệ Công Việc</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body data-page="contact">
    <div class="wallpaper" aria-hidden="true">
      <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
    </div>

    <main class="profile-container">
      <section class="profile-card glass rise">
        <div class="avatar-container glass">
          <img src="./avt.png" class="avatar" alt="Ewiges" />
        </div>
        <h1 class="name">Ewiges</h1>
        <p class="bio" data-i18n="contact">Liên Hệ Công Việc</p>
      </section>

      <nav class="links-container">
        <a href="https://facebook.com/uniquekai7" class="link-btn glass rise" style="--i:1">
          <span class="tile t-blue"><i class="ph ph-facebook-logo"></i></span>
          <span class="label" data-i18n="facebook">Facebook Của Mình</span>
          <i class="ph ph-caret-right chev"></i>
        </a>
        <a href="mailto:ewivietsub@gmail.com" class="link-btn glass rise" style="--i:2">
          <span class="tile t-red"><i class="ph ph-envelope-simple"></i></span>
          <span class="label">ewivietsub@gmail.com</span>
          <i class="ph ph-caret-right chev"></i>
        </a>
        <a href="./wch.jpeg" class="link-btn glass rise" style="--i:3">
          <span class="tile t-green"><i class="ph ph-wechat-logo"></i></span>
          <span class="label">WeChat: r2autumn</span>
          <i class="ph ph-caret-right chev"></i>
        </a>
      </nav>

      <a href="index.html" class="back-link glass rise" style="--i:4">
        <i class="ph ph-arrow-left"></i>
        <span data-i18n="back">Quay lại trang chính</span>
      </a>
    </main>

    <script src="script.js"></script>
  </body>
</html>

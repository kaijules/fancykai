<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d26" />
    <meta name="description" content="Ewiges (@loveisubtw)" />
    <title>Ewiges · @loveisubtw</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body data-page="home">
    <div class="wallpaper" aria-hidden="true">
      <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
    </div>

    <main class="profile-container">
      <section class="profile-card glass rise">
        <div class="avatar-container glass">
          <img src="./avt.jpg" class="avatar" alt="Ewiges" />
        </div>
        <h1 class="name">Ewiges</h1>
        <p class="bio">@loveisubtw</p>
        <div class="social-icons">
          <a href="https://www.tiktok.com/@loveisubtw" class="social-link glass" aria-label="TikTok"><i class="ph ph-tiktok-logo"></i></a>
          <a href="https://www.youtube.com/@w4urluv" class="social-link glass" aria-label="YouTube"><i class="ph ph-youtube-logo"></i></a>
          <a href="https://open.spotify.com/playlist/7svEqt67izltFBi2uBr1Kp" class="social-link glass" aria-label="Spotify"><i class="ph ph-spotify-logo"></i></a>
        </div>
      </section>

      <nav class="links-container">
        <a href="https://open.spotify.com/playlist/7svEqt67izltFBi2uBr1Kp" class="link-btn glass rise" style="--i:1">
          <span class="tile t-green"><i class="ph ph-spotify-logo"></i></span>
          <span class="label" data-i18n="spotify">Playlist Spotify Của Mình</span>
          <i class="ph ph-caret-right chev"></i>
        </a>
        <a href="https://www.youtube.com/@w4urluv" class="link-btn glass rise" style="--i:2">
          <span class="tile t-red"><i class="ph ph-youtube-logo"></i></span>
          <span class="label" data-i18n="youtube">Playlist Youtube Của Mình</span>
          <i class="ph ph-caret-right chev"></i>
        </a>
        <a href="lhcv.html" class="link-btn glass rise" style="--i:3">
          <span class="tile t-blue"><i class="ph ph-briefcase"></i></span>
          <span class="label" data-i18n="contact">Liên Hệ Công Việc</span>
          <i class="ph ph-caret-right chev"></i>
        </a>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
